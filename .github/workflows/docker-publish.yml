name: Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4


      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}


      # 3. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/shiftmatch-backend:latest .


      # 4. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/shiftmatch-backend:latest


      # 5. Deploy to Server
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            echo "Pulling latest Docker image..."

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/shiftmatch-backend:latest

            echo "Stopping old container..."

            docker stop shiftmatch-backend || true

            echo "Removing old container..."

            docker rm shiftmatch-backend || true

            echo "Starting new container..."

            docker run -d \
              --name shiftmatch-backend \
              --restart unless-stopped \
              -p 3333:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/shiftmatch-backend:latest

            echo "Deployment completed."

            docker ps