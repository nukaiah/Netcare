<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .header {
      background-color: #0078D4; /* Outlook Blue */
      color: #ffffff;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }
    .content {
      padding: 20px;
      font-size: 16px;
      line-height: 1.5;
      color: #333333;
    }
    .button {
      display: inline-block;
      background-color: #0078D4;
      color: #ffffff !important;
      padding: 12px 24px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
    }
    .footer {
      font-size: 12px;
      color: #777777;
      text-align: center;
      padding: 15px;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      MyApp Notification
    </div>
    <div class="content">
      <p>Hi {{name}},</p>
      <p>We wanted to let you know about an important update regarding your account.</p>
      <p>{{message}}</p>
      <a href="{{action_url}}" class="button">Take Action</a>
    </div>
    <div class="footer">
      © 2026 MyApp. All rights reserved.<br>
      If you did not request this, please ignore this email.
    </div>
  </div>
</body>
</html>
